<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>SafeTrip</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" /><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/styles.css" /></head>
  <body><header class="authority-header"><a class="brand" href="/"><span class="material-symbols-outlined brand-mark" aria-hidden="true">shield</span><span>Safe<span class="brand-accent">Trip</span></span></a><span class="authority-header-label">CIVIL DEFENCE AUTHORITY CONSOLE</span><nav class="authority-nav" aria-label="View selection"><a class="button button-outline button-small active" href="/authority">Authority view</a><a class="button button-outline button-small" href="/">Tourist view</a><button class="button button-danger button-small" id="authority-logout" type="button">Log out</button></nav></header><main class="authority-page"><a class="back-link" href="/">← Return to tourist view</a><p class="eyebrow">CIVIL DEFENCE CONSOLE</p><h1>Publish a verified alert</h1><p class="lede">This separate workspace is for authorised authorities. Every notice is attributed, timestamped and reviewable before it reaches tourists.</p><form class="authority-form"><label>Alert title<input /></label><label>Severity<select><option>SEVERE</option><option>CRITICAL</option><option>MODERATE</option></select></label><label>Affected area<input /></label><label>Official instructions<textarea rows="5"></textarea></label><div class="form-actions"><button type="button" class="button button-primary">Save as draft</button><button type="button" class="button button-danger">Publish alert</button></div></form></main><script>document.querySelector("#authority-logout").addEventListener("click", async () => { await fetch("/api/auth/logout", { method: "POST" }); window.location.href = "/login"; });</script></body>
</html>
